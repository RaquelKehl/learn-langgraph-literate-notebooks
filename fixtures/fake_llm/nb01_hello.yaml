# Scripted responses for NB 01.
# Every response below was recorded from qwen3:8b (temperature 0, reasoning
# off) on 4 October 2026, so the prompt log shows real model behaviour.
# The first matching rule wins; the order matters (final prompt first).
rules:
  # Final prompt (v2), question the document cannot answer
  - match: "using only the document.*Question: What net profit"
    response: "The document does not say."
  # Final prompt (v2), question the document answers
  - match: "using only the document.*Question: What revenue"
    response: "Solvane Dynamics reported revenue of CHF 342 million for the third quarter of 2025."
  # First prompt (v1), question the document cannot answer
  - match: "^Answer the question\\.\\s+Document:.*Question: What net profit"
    response: "The document provided does not mention the net profit for the third quarter of 2025. It only states the revenue of CHF 342 million and the percentage increase compared to the same quarter of the previous year. Therefore, the net profit cannot be determined from the given information."
  # First prompt (v1), question the document answers
  - match: "^Answer the question\\.\\s+Document:.*Question: What revenue"
    response: "Solvane Dynamics reported revenue of CHF 342 million for the third quarter of 2025."
fallback: null
